name: Docker

on:
  workflow_call:
    inputs:
      tag:
        description: Published release tag
        required: true
        type: string

permissions: {}

concurrency:
  group: docker-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    uses: docker/github-builder/.github/workflows/build.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      context: .
      file: ./docker/Dockerfile
      platforms: linux/amd64,linux/arm64
      distribute: true
      cache: true
      cache-scope: docker
      cache-mode: max
      set-meta-labels: true
      meta-images: ghcr.io/${{ github.repository }}
      meta-flavor: latest=auto
      meta-tags: |
        type=semver,pattern={{version}},value=${{ inputs.tag }}
        type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
        type=semver,pattern={{major}},value=${{ inputs.tag }}
        type=sha
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
